name: Production AI inference smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-inference-smoke.yml'
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render deployment
        run: sleep 150
      - name: Verify real production AI website generation
        shell: bash
        run: |
          set -euo pipefail
          payload='{"businessName":"Northstar Coffee","industry":"Coffee shop","description":"Independent neighborhood coffee shop serving freshly roasted drinks and whole coffee beans.","services":["Espresso drinks","Coffee beans"]}'
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --max-time 100 -o /tmp/ai-response.json -w '%{http_code}' -X POST 'https://forge-studio-free.onrender.com/api/ai/business' -H 'Origin: https://forge-studio-free.onrender.com' -H 'Content-Type: application/json' --data "$payload") || status=000
            if [ "$status" = 200 ]; then break; fi
            echo "Inference request attempt $attempt returned HTTP $status"
            if [ "$attempt" != 3 ]; then sleep 20; fi
          done
          if [ "$status" != 200 ]; then echo "Production inference unavailable (HTTP $status)"; exit 1; fi
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/ai-response.json","utf8"));if(d.provider!=="ollama"||!d.draft?.businessName||!Array.isArray(d.pages)||d.pages.length<1)process.exit(1);console.log("Real production AI generated",d.pages.length,"website pages")'
