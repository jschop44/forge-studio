name: Production AI inference smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-production-ai-smoke
  cancel-in-progress: true
jobs:
  inference:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Verify the current Cloudflare app's live model pipeline
        run: node --import tsx scripts/smoke-agent-pipeline.ts
      - name: Explain verification scope
        if: always()
        run: |
          echo 'Automatic live AI verification runs after deployment in Deploy verified Forge preview.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This manual check uses the same synthetic, non-persistent pipeline against the current Cloudflare preview. It does not queue or publish user sites.' >> "$GITHUB_STEP_SUMMARY"
