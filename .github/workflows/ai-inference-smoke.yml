name: Production AI inference smoke test
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ai-inference-smoke.yml'
      - 'scripts/smoke-agent-pipeline.ts'
      - 'src/lib/design-engine/**'
      - 'src/lib/ai-composition.ts'
      - 'src/lib/business-site.ts'
      - 'src/lib/immersive-showcase.ts'
permissions:
  contents: read
concurrency:
  group: forge-production-ai-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  inference:
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Verify the current Cloudflare app's live model pipeline
        run: node --import tsx scripts/smoke-agent-pipeline.ts
      - name: Explain verification scope
        if: always()
        run: |
          echo 'Automatic live AI verification runs after deployment in Deploy verified Forge preview.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This check uses a synthetic, non-persistent pipeline against the currently deployed Cloudflare preview; it does not verify deployment of PR code, queue jobs, or publish user sites.' >> "$GITHUB_STEP_SUMMARY"
