name: Builder UI regression
on:
  push:
    branches: [main]
    paths:
      - 'e2e/builder.spec.ts'
      - 'src/app/business/**'
      - 'src/lib/business-site.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/builder-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'e2e/builder.spec.ts'
      - 'src/app/business/**'
      - 'src/lib/business-site.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/builder-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builder-ui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  builder-ui:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify builder previews and unavailable/busy recovery
        run: npm run test:e2e -- e2e/builder.spec.ts --project=chromium --workers=2
      - name: Record scope of browser verification
        if: always()
        run: |
          echo 'Builder UI tests use explicit generation fixtures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'These tests do not verify real model inference, deployment or database readiness.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: builder-ui-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
