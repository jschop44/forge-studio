name: Forge Agent Policy Worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  evaluate:
    if: ${{ vars.FORGE_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Evaluate queued agent jobs
        env:
          FORGE_WORKER_URL: ${{ vars.FORGE_WORKER_URL }}
          FORGE_WORKER_SECRET: ${{ secrets.FORGE_WORKER_SECRET }}
        run: |
          test -n "$FORGE_WORKER_SECRET" || exit 1
          curl --fail --show-error --silent --max-time 60 --retry 2 \
            --request POST \
            --header "x-forge-worker-key: $FORGE_WORKER_SECRET" \
            "$FORGE_WORKER_URL"
