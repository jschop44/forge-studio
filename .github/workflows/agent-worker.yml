name: Forge Agent Policy Worker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-worker.yml'
      - 'scripts/drain-agent-queue.mjs'
      - 'tests/drain-agent-queue.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  evaluate:
    if: ${{ vars.FORGE_WORKER_URL != '' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/drain-agent-queue.test.mjs
      - name: Evaluate queued agent jobs
        env:
          FORGE_WORKER_URL: ${{ vars.FORGE_WORKER_URL }}
          FORGE_WORKER_SECRET: ${{ secrets.FORGE_WORKER_SECRET }}
        run: node scripts/drain-agent-queue.mjs
