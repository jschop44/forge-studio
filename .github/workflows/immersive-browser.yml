name: Generated immersive browser verification
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/immersive-showcase.ts'
      - 'src/lib/business-site.ts'
      - 'e2e/generated-immersive.spec.ts'
      - '.github/workflows/immersive-browser.yml'
  workflow_dispatch:
concurrency:
  group: immersive-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/generated-immersive.spec.ts --project=chromium --reporter=list
        env:
          CI: 'true'
