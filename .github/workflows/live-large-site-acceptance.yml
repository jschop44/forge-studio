name: Real large-site acceptance (Best Buy and Disney)
on:
  pull_request:
    paths:
      - 'scripts/live-large-site-acceptance.mjs'
      - '.github/workflows/live-large-site-acceptance.yml'
      - 'src/app/business/page.tsx'
      - 'src/app/api/site-reference/**'
      - 'src/lib/apply-source-design.ts'
      - 'src/lib/observed-product-links.ts'
      - 'src/lib/business-site.ts'
      - 'src/lib/extracted-pages.ts'
      - 'src/lib/source-reuse-policy.ts'
      - 'src/lib/website-design-dna.ts'
  push:
    branches: [main]
    paths:
      - 'scripts/live-large-site-acceptance.mjs'
      - '.github/workflows/live-large-site-acceptance.yml'
      - 'src/app/business/page.tsx'
      - 'src/app/api/site-reference/**'
      - 'src/lib/apply-source-design.ts'
      - 'src/lib/observed-product-links.ts'
      - 'src/lib/business-site.ts'
      - 'src/lib/extracted-pages.ts'
      - 'src/lib/source-reuse-policy.ts'
      - 'src/lib/website-design-dna.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-large-site-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded acceptance runner syntax
        run: node --check scripts/live-large-site-acceptance.mjs
  live-acceptance:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Inspect four real website-generation modes, ZIP links and 390px browser output
        env:
          FORGE_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/live-large-site-acceptance.mjs
      - name: Preserve evidence even when source retrieval or visual tests are blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-site-acceptance-evidence
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 7
