name: Cloudflare alternative deployment
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Cloudflare (requires configured GitHub secrets)"
        required: true
        type: boolean
        default: false
concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start pipeline timer
        run: echo "CLOUDFLARE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: cloudflare-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            cloudflare-npm-${{ runner.os }}-
      - run: npm install --prefer-offline --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: cloudflare-next-${{ runner.os }}-${{ hashFiles('package.json', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            cloudflare-next-${{ runner.os }}-
      - name: Build Next.js for Cloudflare Workers
        run: npm run build:cloudflare
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostics
          path: |
            .open-next/
          if-no-files-found: ignore
          retention-days: 1
      - name: Verify Cloudflare credentials exist
        if: ${{ inputs.publish }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }
      - name: Deploy isolated preview Worker
        if: ${{ inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare

      - name: Smoke test deployed Cloudflare preview
        if: ${{ inputs.publish }}
        env:
          PREVIEW_URL: https://forge-studio-preview.stands-old-3h.workers.dev
        run: |
          set -euo pipefail
          echo "Checking preview homepage"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --max-time 30 --output /tmp/forge-home.html "$PREVIEW_URL/"
          test -s /tmp/forge-home.html || { echo "::error::Preview homepage returned an empty response"; exit 1; }
          echo "Homepage returned nonempty HTTP success response"
          echo "Checking application health API"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 --output /tmp/forge-health.json "$PREVIEW_URL/api/health"
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("/tmp/forge-health.json","utf8")); if(data.ok!==true||data.service!=="forge-studio") process.exit(1); console.log("Health API verified:",data.service)'
          echo "### Cloudflare smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Homepage: HTTP success, nonempty" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health API: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Checking readiness endpoint (diagnostic; external database secrets may not yet be configured)"
          curl --silent --show-error --max-time 20 --output /tmp/forge-ready.json --write-out 'Readiness HTTP status: %{http_code}\\n' "$PREVIEW_URL/api/health/ready" || true
          head -c 500 /tmp/forge-ready.json || true
          echo
          echo "Checking AI inference status (diagnostic only; does not imply generation works)"
          curl --silent --show-error --max-time 20 --output /tmp/forge-ai.json --write-out 'AI status HTTP code: %{http_code}\\n' "$PREVIEW_URL/api/ai/status" || true
          if test -s /tmp/forge-ai.json; then head -c 500 /tmp/forge-ai.json; echo; fi
          echo "- AI generation: not verified by smoke test" >> "$GITHUB_STEP_SUMMARY"
      - name: Pipeline timing summary
        if: always()
        run: |
          echo "### Cloudflare pipeline timing" >> "$GITHUB_STEP_SUMMARY"
          echo "Total job elapsed: $(( $(date +%s) - CLOUDFLARE_STARTED )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "50% faster is a target, not a verified result." >> "$GITHUB_STEP_SUMMARY"
