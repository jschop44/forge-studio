name: Deploy verified Forge preview
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: cloudflare-preview-refs/heads/main
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check verified revision is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if test "$current" = "$VERIFIED_SHA"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer source exists; skipping this older verified revision.'
          fi
      - uses: actions/checkout@v4
        if: steps.revision.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: '22'
      - if: steps.revision.outputs.current == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.revision.outputs.current == 'true'
        run: npm run build:cloudflare
      - name: Recheck current revision before publishing
        id: publish
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if test "$current" = "$VERIFIED_SHA"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer source arrived during packaging; skipping this deployment.'
          fi
      - name: Deploy verified source to existing free preview
        if: steps.publish.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run deploy:cloudflare
      - name: Sync available runtime configuration
        if: steps.publish.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          FORGE_WORKER_SECRET: ${{ secrets.FORGE_WORKER_SECRET }}
        run: node scripts/sync-preview-secrets.mjs
      - name: Verify preview health and report database readiness
        if: steps.publish.outputs.current == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 https://forge-studio-preview.stands-old-3h.workers.dev/api/health -o /tmp/forge-health.json
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("/tmp/forge-health.json","utf8"));if(r.ok!==true||r.service!=="forge-studio")process.exit(1)'
          curl --silent --show-error --max-time 20 https://forge-studio-preview.stands-old-3h.workers.dev/api/health/ready -o /tmp/forge-ready.json
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const ready=JSON.parse(readFileSync('/tmp/forge-ready.json','utf8')).ready===true;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Preview health passed. Database/auth readiness: '+(ready?'passed':'blocked; runtime configuration or database access is incomplete')+'.\nThis does not verify real AI generation or live queue execution.\n');
          console.log('Database/auth readiness: '+(ready?'passed':'blocked'));
          JS
      - name: Verify live open-ended business recognition
        if: steps.publish.outputs.current == 'true'
        run: node scripts/smoke-business-recognition.mjs
      - name: Verify live AI generation through agent quality and approval stages
        if: steps.publish.outputs.current == 'true'
        env:
          FORGE_BASE_URL: https://forge-studio-preview.stands-old-3h.workers.dev
        run: |
          node --import tsx scripts/smoke-agent-pipeline.ts
          echo 'Real Cloudflare AI passed the isolated four-page agent pipeline and quality gate. Publication stopped for approval. This does not persist jobs or publish a site.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify authenticated worker and advance eligible tasks
        if: steps.publish.outputs.current == 'true'
        env:
          FORGE_WORKER_URL: https://forge-studio-preview.stands-old-3h.workers.dev/api/agents/worker
          FORGE_WORKER_SECRET: ${{ secrets.FORGE_WORKER_SECRET }}
        run: |
          node --test tests/drain-agent-queue.test.mjs
          node scripts/drain-agent-queue.mjs
          echo 'Authenticated worker passed. Eligible stages advanced within the batch limit; approval gates were preserved.' >> "$GITHUB_STEP_SUMMARY"
