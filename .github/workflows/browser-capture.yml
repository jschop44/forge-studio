name: Browser capture smoke test
on:
  push:
    paths:
      - 'workers/browser-capture.mjs'
      - 'workers/navigation-probe-policy.mjs'
      - 'workers/public-network-policy.mjs'
      - 'tests/navigation-probe-policy.test.mjs'
      - 'tests/public-network-policy.test.mjs'
      - 'workers/evidence-to-blueprint.mjs'
      - 'tests/evidence-to-blueprint.test.mjs'
      - 'workers/blueprint-to-html.mjs'
      - 'tests/blueprint-to-html.test.mjs'
      - 'workers/immersive-depth-scene.mjs'
      - 'tests/immersive-depth-scene.test.mjs'
      - 'workers/blueprint-quality.mjs'
      - 'tests/blueprint-quality.test.mjs'
      - '.github/workflows/browser-capture.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: Public HTTPS site to inspect
        required: true
        default: https://example.com
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate navigation and network safety policies
        run: node --test tests/navigation-probe-policy.test.mjs tests/public-network-policy.test.mjs tests/evidence-to-blueprint.test.mjs tests/blueprint-to-html.test.mjs tests/blueprint-quality.test.mjs tests/immersive-depth-scene.test.mjs tests/preview-manifest.test.mjs tests/preview-navigation-audit.test.mjs tests/depth-scene-svg.test.mjs tests/capture-redirect-policy.test.mjs
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture allowed public site
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://example.com' }}
        run: |
          node -e "const u=new URL(process.env.TARGET_URL);if(u.protocol!=='https:'||u.hostname!=='example.com')process.exit(1)"
          FORGE_CAPTURE_HOSTS=example.com node workers/browser-capture.mjs "$TARGET_URL" > browser-evidence.json
          node -e "const fs=require('node:fs');const e=JSON.parse(fs.readFileSync('browser-evidence.json','utf8'));const p=e.pages[0];console.log(JSON.stringify({title:p?.title,landmarks:p?.landmarks?.length,visualRegions:p?.visualRegions?.length,navigationChecks:p?.navigationChecks?.length,screenshot:p?.screenshotUrl}));if(e.version!==1||e.pages.length<1||e.pages.length>4||!p?.title||!Array.isArray(p.visualRegions)||!p.visualRegions.length||!Array.isArray(p.navigationChecks)||p.navigationChecks.length>8||p.screenshotUrl!=='browser-screenshot.png'||!fs.statSync('browser-screenshot.png').size)process.exit(1)"
      - name: Convert capture to editable blueprint
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {evidenceToBlueprint} from './workers/evidence-to-blueprint.mjs';const evidence=JSON.parse(fs.readFileSync('browser-evidence.json','utf8'));const blueprint=evidenceToBlueprint(evidence);if(!blueprint.sections.length||!blueprint.headline||blueprint.provenance.generatedContent!==false)process.exit(1);fs.writeFileSync('website-blueprint.json',JSON.stringify(blueprint,null,2));console.log(JSON.stringify({title:blueprint.title,sections:blueprint.sections.length,links:blueprint.navigation.length}));"
      - name: Audit captured blueprint
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {assessBlueprint} from './workers/blueprint-quality.mjs';const blueprint=JSON.parse(fs.readFileSync('website-blueprint.json','utf8'));const report=assessBlueprint(blueprint);if(!report.checks.pageCoverage||!report.checks.visualRegions||!report.checks.sourceProvenance||!report.checks.measuredGeometry)process.exit(1);fs.writeFileSync('website-quality.json',JSON.stringify(report,null,2));"
      - name: Generate deterministic depth scene metadata
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {buildDepthScene,projectDepthScene} from './workers/immersive-depth-scene.mjs';const blueprint=JSON.parse(fs.readFileSync('website-blueprint.json','utf8'));const scene=buildDepthScene(blueprint);if(scene.publicationReady!==false)process.exit(1);fs.writeFileSync('website-depth-scene.json',JSON.stringify(scene,null,2));const mobile=projectDepthScene(scene,375,{reducedMotion:true});if(mobile.animationEnabled||mobile.layers.some(l=>l.depth!==0))process.exit(1);fs.writeFileSync('website-mobile-depth-scene.json',JSON.stringify(mobile,null,2));"
      - name: Render accessible depth visualization
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {buildDepthScene} from './workers/immersive-depth-scene.mjs';import {renderDepthSceneSvg} from './workers/depth-scene-svg.mjs';const blueprint=JSON.parse(fs.readFileSync('website-blueprint.json','utf8'));const svg=renderDepthSceneSvg(buildDepthScene(blueprint),960,{reducedMotion:true});if(!svg.startsWith('<svg ')||svg.includes('<script'))process.exit(1);fs.writeFileSync('website-depth-preview.svg',svg);"
      - name: Render safe website preview from blueprint
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {blueprintToHtml,blueprintToPages} from './workers/blueprint-to-html.mjs';const blueprint=JSON.parse(fs.readFileSync('website-blueprint.json','utf8'));const html=blueprintToHtml(blueprint);if(!html.includes('<!doctype html>'))process.exit(1);fs.writeFileSync('website-preview.html',html);fs.mkdirSync('website-pages',{recursive:true});const pages=blueprintToPages(blueprint);for(const page of pages){if(!/^[a-zA-Z0-9_-]+\\.html$/.test(page.filename))throw Error('Unsafe output filename');fs.writeFileSync('website-pages/'+page.filename,page.html)}if(!pages.length)process.exit(1);"
      - name: Generate offline preview manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {buildPreviewManifest} from './workers/preview-manifest.mjs';const blueprint=JSON.parse(fs.readFileSync('website-blueprint.json','utf8'));const manifest=buildPreviewManifest(blueprint);for(const page of manifest.pages){const actual=fs.statSync('website-pages/'+page.filename).size;if(actual!==page.bytes)throw Error('Preview manifest byte count mismatch')}fs.writeFileSync('website-preview-manifest.json',JSON.stringify(manifest,null,2));"
      - name: Audit exported preview navigation
        run: |
          node --input-type=module -e "import fs from 'node:fs';import {auditPreviewNavigation} from './workers/preview-navigation-audit.mjs';const blueprint=JSON.parse(fs.readFileSync('website-blueprint.json','utf8'));const report=auditPreviewNavigation(blueprint);if(!report.allLinksValid)process.exit(1);fs.writeFileSync('website-navigation-audit.json',JSON.stringify(report,null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            browser-evidence.json
            browser-screenshot.png
            website-blueprint.json
            website-quality.json
            website-depth-scene.json
            website-mobile-depth-scene.json
            website-depth-preview.svg
            website-preview.html
            website-pages/
            website-preview-manifest.json
            website-navigation-audit.json
          retention-days: 1
