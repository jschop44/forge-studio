name: Browser capture smoke test
on:
  push:
    paths:
      - 'workers/browser-capture.mjs'
      - '.github/workflows/browser-capture.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: Public HTTPS site to inspect
        required: true
        default: https://example.com
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture allowed public site
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://example.com' }}
        run: |
          node -e "const u=new URL(process.env.TARGET_URL);if(u.protocol!=='https:'||u.hostname!=='example.com')process.exit(1)"
          FORGE_CAPTURE_HOSTS=example.com node workers/browser-capture.mjs "$TARGET_URL" > browser-evidence.json
          node -e "const fs=require('node:fs');const e=JSON.parse(fs.readFileSync('browser-evidence.json','utf8'));const p=e.pages[0];console.log(JSON.stringify({title:p?.title,landmarks:p?.landmarks?.length,visualRegions:p?.visualRegions?.length,screenshot:p?.screenshotUrl}));if(e.version!==1||e.pages.length!==1||!p?.title||!Array.isArray(p.visualRegions)||!p.visualRegions.length||p.screenshotUrl!=='browser-screenshot.png'||!fs.statSync('browser-screenshot.png').size)process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            browser-evidence.json
            browser-screenshot.png
          retention-days: 1
