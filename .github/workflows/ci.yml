name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start pipeline timing
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Fast policy, unit, worker, and TypeScript checks
        run: npm run verify:fast
      - name: Verification summary
        if: always()
        run: |
          echo '## Forge Studio policy, unit, worker and type checks' >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed job time: $(( $(date +%s) - VERIFY_STARTED )) seconds" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start build timing
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-
      - run: npm run build
      - name: Build summary
        if: always()
        run: |
          echo '## Forge Studio production build' >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed job time: $(( $(date +%s) - VERIFY_STARTED )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production compilation does not establish that live AI inference is available.' >> "$GITHUB_STEP_SUMMARY"

  cloudflare_package:
    name: Cloudflare Worker packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Guard canonical Cloudflare Worker target
        run: node scripts/check-cloudflare-worker-target.mjs
      - name: Package application for Cloudflare Workers without deploying
        run: npm run build:cloudflare
      - name: Verify generated Worker and assets
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
      - name: Publish diagnostic summary
        if: always()
        run: |
          echo 'Cloudflare OpenNext packaging was tested without publishing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare dashboard build settings and credentials are verified separately.' >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Browser checks (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start pipeline timing
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: Run Chromium browser tests
        run: npm run test:e2e -- --project=chromium --workers=2 --shard=${{ matrix.shard }}/2
      - name: Publish browser verification summary
        if: always()
        run: |
          echo '## Forge Studio browser verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed job time: $(( $(date +%s) - VERIFY_STARTED )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo '- Review the browser job results and attached Playwright report.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Verification, production build, and browser jobs must all pass before release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-verification-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
