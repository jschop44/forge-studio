name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start pipeline timing
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Fast policy, unit, worker, and TypeScript checks
        run: npm run verify:fast
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package.json', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-
      - run: npm run build
      - name: Application verification summary
        if: always()
        run: |
          echo '## Forge Studio application verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed job time: $(( $(date +%s) - VERIFY_STARTED )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the individual policy, unit, worker, typecheck, and build steps above.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful build alone does not establish that production Ollama inference is reachable.' >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start pipeline timing
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - run: npm install --prefer-offline --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish browser verification summary
        if: always()
        run: |
          echo '## Forge Studio browser verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Elapsed job time: $(( $(date +%s) - VERIFY_STARTED )) seconds" >> "$GITHUB_STEP_SUMMARY"
          echo '- Review the browser job results and attached Playwright report.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Both application and browser jobs must pass before release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-verification-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
