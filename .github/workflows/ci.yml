name: Verify
on:
  push:
  pull_request:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:workers
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish verification summary
        if: always()
        run: |
          echo '## Forge Studio verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Application, worker, typecheck, build, and Playwright steps are listed above with their individual results.' >> "$GITHUB_STEP_SUMMARY"
          echo '- A successful job means all required verification steps passed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
